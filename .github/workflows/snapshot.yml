# Crawls Fanfares activity from Nostr relays and publishes the static
# Fanfares Index (explorer + prebuilt /api/v1/ JSON) to Cloudflare.
#
# The crawl archive (data/, SQLite) persists between runs in the Actions
# cache under a rolling key. If the cache is gone, the run re-seeds the
# archive from the published snapshot (snapshot/seed.mjs) and then crawls
# incrementally. With neither, it stops unless run with full=true.
#
# Setup (see README "Static snapshot"):
#   secret  CLOUDFLARE_API_TOKEN  token with "Workers Scripts: Edit" on the personal account
#   var     SNAPSHOT_URL          public URL of the deployed site, e.g. https://fanfares-index-static.<sub>.workers.dev
#   secrets GCP_PROJECT, GCP_BUCKET, GCP_SERVICE_ACCOUNT, GCP_WORKLOAD_IDENTITY_PROVIDER
#           (optional) back up the archive to Cloud Storage and refresh BigQuery
# Without the token the run still crawls and builds, and skips the deploy.
name: Snapshot

on:
  schedule:
    # Hourly, off the top of the hour when GitHub's scheduler is busiest.
    # A run takes about a minute. On a private repo (2,000 free minutes a
    # month) keep it hourly or slower; public repos have unlimited minutes.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Re-read full history from relays (slow, heavy on relays)
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # prune old archive caches
  id-token: write # keyless sign-in to Google Cloud (Workload Identity Federation)

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Google Cloud (optional): identifiers, kept as secrets so public logs mask them.
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCP_BUCKET: ${{ secrets.GCP_BUCKET }}
      SNAPSHOT_URL: ${{ vars.SNAPSHOT_URL }}
      INTERVAL_MIN: '60'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore archive
        id: archive
        uses: actions/cache/restore@v4
        with:
          path: data
          key: archive-${{ github.run_id }}
          restore-keys: archive-

      # A relay crawl alone cannot rebuild everything (worker-verified purchases
      # and events relays no longer serve came from the legacy feed), so never
      # start from scratch unless asked to with the `full` input.
      - name: Seed archive from the published snapshot
        if: steps.archive.outputs.cache-matched-key == ''
        env:
          FULL: ${{ inputs.full && '1' || '' }}
        run: |
          if [ -n "$SNAPSHOT_URL" ]; then node --no-warnings snapshot/seed.mjs "$SNAPSHOT_URL" || code=$?; else code=2; fi
          if [ "${code:-0}" = 2 ]; then
            if [ -n "$FULL" ]; then echo "No snapshot to seed from; crawling full history as requested."; exit 0; fi
            echo "::error::No cached archive and no snapshot at SNAPSHOT_URL to seed from. Publish a snapshot first (README), or run with full=true to start from relays only."
            exit 1
          fi
          exit "${code:-0}"

      - name: Crawl relays
        id: sync
        timeout-minutes: 15
        run: |
          mkdir -p data # gitignored, so absent on a fresh runner without a cached archive
          node --no-warnings sync.js ${{ inputs.full && '--full' || '' }}

      - name: Save archive
        if: always() && steps.sync.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data
          key: archive-${{ github.run_id }}

      - name: Build static site
        run: node --no-warnings snapshot/build.mjs --interval-min "$INTERVAL_MIN"

      - name: Check static API against the dynamic one
        run: node --no-warnings snapshot/parity.mjs

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.92.0 deploy --config snapshot/wrangler.jsonc

      - name: Sign in to Google Cloud
        if: env.GCP_PROJECT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud and bq
        if: env.GCP_PROJECT != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Back up the archive to Cloud Storage
        if: env.GCP_PROJECT != ''
        run: |
          node --no-warnings -e "new (require('node:sqlite').DatabaseSync)('data/fanfares.sqlite').exec(\"VACUUM INTO 'fanfares.sqlite'\")"
          gzip -9 fanfares.sqlite
          gcloud storage cp fanfares.sqlite.gz "gs://$GCP_BUCKET/latest/fanfares.sqlite.gz"
          # One copy per UTC day (the bucket deletes them after 35 days).
          gcloud storage cp --no-clobber fanfares.sqlite.gz "gs://$GCP_BUCKET/daily/$(date -u +%F).sqlite.gz"

      - name: Refresh BigQuery
        if: env.GCP_PROJECT != ''
        run: |
          node --no-warnings snapshot/export-bq.mjs
          snapshot/load-bq.sh "$GCP_PROJECT" fanfares bq

      - name: Prune old archive caches
        if: always() && steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key archive- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
