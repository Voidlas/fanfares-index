<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fanfares Index</title>
  <meta name="description" content="Everything that has ever happened on Fanfares: every release, creator, buyer and the zap receipts behind every purchase, in one live, searchable index read from Nostr.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Fanfares Index">
  <meta property="og:description" content="Every release, creator, buyer and zap receipt on Fanfares, in one live, searchable index.">
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Fanfares Index home">
        <img src="/img/logo.png" alt="" width="32" height="32">
        <span class="brand-name">Fanfares <em>Index</em></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home"><svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 10 3l7 5.5V16a1 1 0 0 1-1 1h-3.5v-5h-5v5H4a1 1 0 0 1-1-1z"/></svg><span>Overview</span></a>
        <a href="#/releases" data-nav="releases"><svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2"/><rect x="3" y="11" width="6" height="6" rx="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2"/></svg><span>Releases</span></a>
        <a href="#/creators" data-nav="creators"><svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="7" r="3.2"/><path d="M3.8 17c.9-3.1 3.3-4.6 6.2-4.6s5.3 1.5 6.2 4.6"/></svg><span>Creators</span></a>
        <a href="#/supporters" data-nav="supporters"><svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 2.5 4.5 11h5l-1 6.5 7-8.5h-5z"/></svg><span>Supporters</span></a>
        <a href="#/insights" data-nav="insights"><svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h14M5.5 14V9M10 14V4.5M14.5 14v-6"/></svg><span>Insights</span></a>
        <a href="#/live" data-nav="live"><svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="2"/><path d="M5.6 5.6a6.2 6.2 0 0 0 0 8.8M14.4 5.6a6.2 6.2 0 0 1 0 8.8"/></svg><span>Live</span></a>
        <a href="#/api" data-nav="api" class="nav-desktop"><svg class="nav-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 6-4 4 4 4M13 6l4 4-4 4"/></svg><span>API</span></a>
      </nav>
      <div class="sync-pill" id="sync-pill" title="Index sync status">
        <span class="dot"></span><span class="sync-text">Connecting…</span>
      </div>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <strong>Fanfares Index</strong> is an open archive of public Nostr events published through
        <a href="https://fanfares.io" target="_blank" rel="noopener">Fanfares</a>. Every number here is computed
        from signed events anyone can fetch from relays.
      </div>
      <div class="footer-links">
        <a href="#/api">API</a>
        <a href="#/live">Sync status</a>
        <label class="toggle"><input type="checkbox" id="show-test"> Include test releases</label>
      </div>
    </div>
  </footer>

  <div class="player" id="player" hidden>
    <img class="player-cover" alt="">
    <div class="player-meta"><div class="player-title"></div><div class="player-sub">Free preview</div></div>
    <audio controls preload="none"></audio>
    <button class="icon-btn player-close" aria-label="Close player">✕</button>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
